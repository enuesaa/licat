name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            as: linux-x64

          - os: ubuntu-latest
            rid: linux-arm64
            as: linux-arm64

          - os: macos-latest
            rid: osx-arm64
            as: aarch64-apple-darwin

          - os: macos-15-intel
            rid: osx-x64
            as: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet publish licat.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o ./publish/${{ matrix.as }}

      - shell: bash
        run: |
          cd ./publish/${{ matrix.as }}
          tar czf ../../licat-${{ matrix.as }}.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: licat-${{ matrix.as }}
          path: licat-${{ matrix.as }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - working-directory: artifacts
        run: |
          sha256sum *.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
